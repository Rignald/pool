<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1b4d3e"/>
      <stop offset="60%" stop-color="#0b241c"/>
      <stop offset="100%" stop-color="#05120e"/>
    </radialGradient>
    
    <!-- 8-Ball Shadow & 3D sphere gradient -->
    <radialGradient id="ballShade" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="25%" stop-color="#222222"/>
      <stop offset="65%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    
    <!-- Ball Highlight -->
    <radialGradient id="highlight" cx="35%" cy="28%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- White Circle Inner Shadow -->
    <radialGradient id="whiteCircle" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#d0d0d0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Rounded Background for Android Adaptive Icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)"/>

  <!-- Subtle Billiard Cloth Texture Pattern Rings -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#24604e" stroke-width="2" opacity="0.4"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#24604e" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.3"/>

  <!-- Ball Drop Shadow -->
  <ellipse cx="256" cy="405" rx="145" ry="32" fill="#000000" opacity="0.55"/>

  <!-- Main 8-Ball -->
  <circle cx="256" cy="256" r="160" fill="url(#ballShade)" filter="url(#shadow)"/>

  <!-- White Center Disc -->
  <circle cx="256" cy="246" r="70" fill="url(#whiteCircle)"/>

  <!-- Number 8 -->
  <text x="256" y="278" font-family="'Impact', 'Arial Black', sans-serif" font-size="94" font-weight="900" text-anchor="middle" fill="#111111">8</text>

  <!-- Specular 3D Highlight -->
  <circle cx="256" cy="256" r="160" fill="url(#highlight)"/>
  <ellipse cx="225" cy="180" rx="45" ry="25" fill="#ffffff" opacity="0.3" transform="rotate(-25 225 180)"/>

  <!-- Cue chalk badge top-right -->
  <g transform="translate(370, 75) rotate(15)">
    <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#1976d2" stroke="#64b5f6" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="14" fill="#0d47a1"/>
    <circle cx="0" cy="0" r="8" fill="#e3f2fd" opacity="0.5"/>
  </g>
</svg>
